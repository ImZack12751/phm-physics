# Builds the site and publishes it to GitHub Pages on every push to main.
# The build also re-checks every chapter's numbers and the built site (KaTeX errors,
# broken links, caret notation, raw markdown), so a broken site is never deployed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      # Re-running an old run would redeploy old code over newer code. Refuse unless this
      # commit is still the tip of main.
      - name: Refuse to deploy a stale commit
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "${{ github.sha }}" ]; then
            echo "::error::This run is for ${{ github.sha }}, but main is now at $latest. Re-run the newest run (or push again) instead."
            exit 1
          fi
      - name: Install, build, verify and upload
        uses: withastro/action@v6
        with:
          node-version: 24
          build-cmd: npm run build:ci

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
